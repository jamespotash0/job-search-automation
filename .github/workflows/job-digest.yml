name: Job digest (3x daily)

on:
  schedule:
    # Times are UTC. These map to 8:57am / 12:57pm / 3:57pm ET during EDT (summer).
    # In winter (EST) they'll land at 7:57 / 11:57 / 2:57 — shift by 1h if you care.
    # Minute :57 (not :00) deliberately dodges the top-of-hour cron pile-up on
    # GitHub Actions, which routinely delays :00 runs 15-60+ min. No SLA either
    # way, but back-of-the-hour slots are delayed far less often.
    - cron: "57 12,16,19 * * *"
  workflow_dispatch:

permissions:
  contents: write            # push the updated seen-cache to the `state` branch

concurrency:
  group: job-digest          # never overlap two job runs (seen-cache safety)
  cancel-in-progress: false

jobs:
  jobs-digest:
    runs-on: ubuntu-latest
    # Runners are UTC; render digest timestamps + "today/1d ago" labels in ET.
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Durable state on the `state` branch: the "already-seen" list (so 1pm/4pm
      # don't repeat 9am's postings) plus the shared ATS watchlist written by the
      # funding digest (read-only here — this workflow never writes it back).
      - name: Restore state
        run: |
          git fetch -q origin state 2>/dev/null || true
          for f in seen_jobs.json ats_watchlist.json; do
            git cat-file -e "origin/state:$f" 2>/dev/null \
              && git show "origin/state:$f" > "$f" && echo "restored $f" || true
          done

      - name: Send job digest
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO:   ${{ secrets.EMAIL_TO }}
        run: python job_digest.py

      # Persist only the seen-cache; the watchlist is owned by the funding digest.
      - name: Persist state
        if: always()
        env:
          FILES: "seen_jobs.json"
        run: bash .github/persist-state.sh
