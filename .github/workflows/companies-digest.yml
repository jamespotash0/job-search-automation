name: Companies digest (daily)

on:
  schedule:
    # Actions cron is UTC-only, so every slot is registered TWICE — once for EDT,
    # once for EST — and the `gate` job below drops whichever set is not in effect.
    # That keeps delivery at 8:57am / 12:57pm / 3:57pm ET year-round instead of
    # sliding an hour earlier every November. Keep these in sync with the gate's
    # TARGET_ET_HOURS; see .github/dst-gate.sh.
    #
    # Minute :57 (not :00) deliberately dodges the top-of-hour cron pile-up on
    # GitHub Actions, which routinely delays :00 runs 15-60+ min. This only moves
    # the *scheduled* time: Actions gives scheduled runs no SLA and has still been
    # starting these 60-90 min late, which no cron change on our side can fix.
    # Once a day. Three runs a day mostly re-sent the same boards: a posting
    # only appears once (seen_jobs dedupes), so the extra runs were catching a
    # handful of new postings each and reading as repetition.
    - cron: "57 12 * * *"        # EDT (Mar-Nov) -> 8:57 ET
    - cron: "57 13 * * *"        # EST (Nov-Mar) -> 8:57 ET
  workflow_dispatch:

permissions:
  contents: write            # push the updated seen-cache to the `state` branch

concurrency:
  group: companies-digest    # never overlap two runs (seen-cache safety)
  cancel-in-progress: false

jobs:
  # Drop the half of the schedule that belongs to the other DST period.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          TARGET_ET_HOURS: "8 12 15"
          SCHEDULE: ${{ github.event.schedule }}
        run: bash .github/dst-gate.sh

  companies-digest:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Runners are UTC; render digest timestamps + "today/1d ago" labels in ET.
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Durable state on the `state` branch: the "already-seen" list (so 1pm/4pm
      # don't repeat 9am's postings) plus the shared ATS watchlist written by the
      # funding digest (read-only here — this workflow never writes it back).
      - name: Restore state
        run: |
          git fetch -q origin state 2>/dev/null || true
          for f in seen_jobs.json ats_watchlist.json; do
            git cat-file -e "origin/state:$f" 2>/dev/null \
              && git show "origin/state:$f" > "$f" && echo "restored $f" || true
          done

      # Same as the funding workflow: the compiled profile (resume-derived titles,
      # locations) is gitignored on this public repo, so ship it as a secret and
      # write it to disk here. Without it the digest uses the generic default
      # titles baked into the script. Paste your local profile.compiled.json.
      - name: Write compiled profile
        env:
          PROFILE_COMPILED_JSON: ${{ secrets.PROFILE_COMPILED_JSON }}
        run: |
          if [ -n "$PROFILE_COMPILED_JSON" ]; then
            printf '%s' "$PROFILE_COMPILED_JSON" > profile.compiled.json
            echo "wrote profile.compiled.json ($(wc -c < profile.compiled.json) bytes)"
          else
            echo "::warning::PROFILE_COMPILED_JSON not set — using generic default titles"
          fi

      # Every knob documented in .env.example can be set as a repo *variable*
      # (Settings -> Secrets and variables -> Actions -> Variables) — scoring
      # weights, source toggles, caps. They land in the environment here, so
      # retuning a scheduled run never means editing code. Secrets are passed at
      # the step level below and always win over anything set here.
      - name: Load tuning variables
        env:
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json, os
          for k, v in json.loads(os.environ["VARS_JSON"] or "{}").items():
              v = str(v)
              if "\n" not in v:            # $GITHUB_ENV is line-oriented
                  print(f"{k}={v}")
          PY

      - name: Send companies digest
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO:   ${{ secrets.EMAIL_TO }}
          # Optional sources — each auto-disables if its key is unset (see the
          # USE_ADZUNA / USE_GROK_X toggles in companies_digest.py).
          ADZUNA_APP_ID:  ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          # Either name works (the script aliases GROK_API_KEY -> XAI_API_KEY).
          XAI_API_KEY:    ${{ secrets.XAI_API_KEY }}
          GROK_API_KEY:   ${{ secrets.GROK_API_KEY }}
        run: python companies_digest.py

      # Persist only the seen-cache; the watchlist is owned by the funding digest.
      - name: Persist state
        if: always()
        env:
          FILES: "seen_jobs.json"
        run: bash .github/persist-state.sh
