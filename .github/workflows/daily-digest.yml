name: Daily funding digest

on:
  schedule:
    # Actions cron is UTC-only, so the 8am ET slot is registered TWICE — once for
    # EDT, once for EST — and the `gate` job below drops whichever is not in
    # effect, holding 8am ET year-round. Keep in sync with the gate's
    # TARGET_ET_HOURS; see .github/dst-gate.sh.
    - cron: "0 12 * * *"     # EDT (Mar-Nov) -> 8am ET
    - cron: "0 13 * * *"     # EST (Nov-Mar) -> 8am ET
  workflow_dispatch:

permissions:
  contents: write            # push persisted state to the `state` branch

concurrency:
  group: funding-digest      # never overlap two funding runs (state safety)
  cancel-in-progress: false

jobs:
  # Drop the half of the schedule that belongs to the other DST period.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          TARGET_ET_HOURS: "8"
          SCHEDULE: ${{ github.event.schedule }}
        run: bash .github/dst-gate.sh

  digest:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Runners are UTC; render digest timestamps in ET so the email clock matches.
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      # Durable state lives on the `state` branch (survives cache eviction and is
      # inspectable). Pull the files this digest reads/updates: enrichment cache,
      # Hunter monthly counter, and the shared ATS watchlist (the loop).
      - name: Restore state
        run: |
          git fetch -q origin state 2>/dev/null || true
          for f in enrich_cache.json hunter_usage.json ats_watchlist.json; do
            git cat-file -e "origin/state:$f" 2>/dev/null \
              && git show "origin/state:$f" > "$f" && echo "restored $f" || true
          done

      # Web-search LinkedIn "we're hiring" posts / hiring roundups for companies
      # hiring your roles, probe their ATS, and add hits to ats_watchlist.json.
      # Non-fatal: a discovery failure never blocks the digest.
      - name: Discover hiring companies
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python discover.py

      - name: Send digest
        env:
          EMAIL_USER:        ${{ secrets.EMAIL_USER }}
          EMAIL_PASS:        ${{ secrets.EMAIL_PASS }}
          EMAIL_TO:          ${{ secrets.EMAIL_TO }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HUNTER_API_KEY:    ${{ secrets.HUNTER_API_KEY }}
        run: python funding_digest.py

      # Persist enrichment cache, Hunter counter, and the watchlist so we never
      # re-spend API calls and the companies digest sees newly-raised companies.
      - name: Persist state
        if: always()
        env:
          FILES: "enrich_cache.json hunter_usage.json ats_watchlist.json"
        run: bash .github/persist-state.sh
